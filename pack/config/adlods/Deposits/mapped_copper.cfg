# Configuration file
# Additional copper deposits anchored to naturally generated survey camps.
# Supplements ordinary ore generation; bundled large-deposit definitions remain disabled.

Config {
    B:enabled=true
}

Deposit {
    S:customReplacements <
        #minecraft:deepslate_ore_replaceables -> minecraft:deepslate_copper_ore
     >

    S:descendants <
     >

    S:ores <
        minecraft:copper_ore
     >

    # Zero disables independent random placement, not structure-triggered attempts.
    # Camp frequency is controlled by the survey_camp_copper structure set.
    I:rarity=0

    S:replaceableBlocks <
        #minecraft:stone_ore_replaceables
     >

    B:vanilla=false

    Dimensions {
        S:blackList <
         >
        S:whiteList <
            minecraft:overworld
         >
    }

    # Let the surface structure determine eligible biomes. Underground cave biomes
    # must not veto the deposit beneath an otherwise eligible camp.
    Biomes {
        S:blackList <
         >
        S:whiteList <
         >
    }

    Altitude {
        S:max=0
        S:min=-123
    }

    Miscellaneous {
        S:altitudeOffset=0..0
        # Ore may border caves; air itself is not replaced.
        B:exposed=true
        I:maxAttempts=64
        S:proportions=0.5
        # Apply the underground altitude limits to every placed ore block.
        B:strictBounds=true
        # Allow starting in deepslate through the custom replacement rule.
        B:strictStart=false
        B:surfaceBiomes=false
    }

    Indicator {
        # The camp is the marker; do not add flower circles.
        S:circles <
         >
        S:continuity=0.0
        I:distortion=0
        S:id=qualitynotassured:survey_camp_copper
        # 100% generation attempt beneath each matching structure.
        # Terrain can still reduce the actual number of blocks placed.
        S:threshold=100.0
    }

    Size {
        I:max=20000
        I:min=10000
    }
}
