# This is the default extra filter file for Async Logger. The filters in this file (and any other *.toml files in this directory) are combined with the filters in the main config.
# You can freely write comments and format this file as you wish - it will not get overwritten.
[filtering]
    levels = []
    loggers = []
    strings = []
    regexes = [
        "^Tried to load invalid item: 'Item must not be minecraft:air'$",
        '^Skipping Entity with id .+$',
        '^Tried to load a DUMMY block entity @ .* but found not block entity block Block\{minecraft:snow\}\[layers=1\] at location$',
        '^Tried to load a block entity for block Block\{minecraft:snow\}\[layers=1\] but failed at location .*$',
    ]
